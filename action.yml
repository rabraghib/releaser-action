name: "Releaser Action"
description: "Generate a changelog and bump version files"
inputs:
  token:
    description: "GitHub token with contents: write permission"
    required: false
    default: ${{ github.token }}

  version:
    description: "The version to release (accepts including var. e.g '{major}.{minor}.{patch}')"
    required: false
    default: "{major}.{minor}.{patch}"

  extra-tags:
    description: "The git tags to release (accepts including var. e.g 'v{major}')"
    required: false

  skip-on-empty:
    description: "Do nothing when the changelog from the latest release is empty"
    required: false
    default: "true"

  version-file:
    description: "The file containing the version number"
    required: false
    default: "package.json"

  bump-files:
    description: "The file paths/glob-patterns to bump"
    required: false
    default: "package.json"

  output-file:
    description: "File to output the changelog to"
    default: "CHANGELOG.md"
    required: false

  tag-prefix:
    description: "The prefix of the tag to release"
    required: false
    default: "v"

  release-count:
    description: "Changelog sections to generate, including the new release; 0 regenerates all history"
    required: false
    default: "0"

  birthday:
    description: "The date that will be used to calculate 'years', 'months' and 'days' variables. format 'YYYY-MM-DD'"
    required: false

outputs:
  tag:
    description: "The name of the created tag"
  release_notes:
    description: "The release notes"
  version:
    description: "The published version"
  released:
    description: "Whether a release was published"

runs:
  using: "node24"
  main: "dist/index.js"
